#
# Конфигурационный файл WorldGuard для мира
#
# Это индивидуальный файл настроек для конкретного мира.
# Изменения влияют только на соответствующий мир.
#
# Правила редактирования:
# - НЕ ИСПОЛЬЗУЙТЕ ТАБУЛЯЦИЮ. Только пробелы, иначе Bukkit выдаст ошибку.
#   В редакторах типа Notepad++ (рекомендуется для Windows) включите
#   опцию "заменять табы на пробелы" (Настройки > Параметры > Меню Языка).
# - Сохраняйте отступы. Они группируют параметры по категориям
#   (например, "enforce-single-session" относится к категории "protection").
# - Для проверки формата перед использованием вставьте содержимое на сайт
#   http://yaml-online-parser.appspot.com/ и убедитесь, что нет ошибок ("ERROR:").
# - Строки, начинающиеся с #, являются комментариями и игнорируются.
#

